name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-agent-linux:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal
      - name: Fetch the macOS dependency sources for the macOS job
        run: cd agent && cargo fetch --locked --target aarch64-apple-darwin
      - name: Build agent (Linux musl)
        run: make agent-build
      - name: Save the cargo registry for the macOS job
        run: |
          cargo_registry=
          for candidate in "${CARGO_HOME:-}" "$HOME/.cargo" /usr/local/cargo; do
            [ -n "$candidate" ] || continue
            registry="$candidate/registry"
            [ -d "$registry" ] || continue
            if [ -n "$(find "$registry" -mindepth 1 -print -quit 2>/dev/null)" ]; then
              cargo_registry=$registry
              break
            fi
          done
          test -n "$cargo_registry" || { echo "cargo registry not found" >&2; exit 1; }
          rm -rf "$GITHUB_WORKSPACE/.cargo-registry"
          mkdir -p "$GITHUB_WORKSPACE/.cargo-registry"
          cp -a "$cargo_registry/." "$GITHUB_WORKSPACE/.cargo-registry/"
      - name: Upload cargo registry
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-registry
          path: .cargo-registry
          include-hidden-files: true
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-linux
          path: |
            agent/dist/stats-*-x86_64-unknown-linux-musl
            agent/dist/stats-*-aarch64-unknown-linux-musl
            agent/dist/SHA256SUMS

  build-agent-macos:
    needs: build-agent-linux
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal
      - name: Download the cargo registry from the Linux job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-registry
          path: .cargo-registry
      - name: Restore the cargo registry
        run: |
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          mkdir -p "$cargo_home/registry"
          cp -a "$GITHUB_WORKSPACE/.cargo-registry/." "$cargo_home/registry/"
      - name: Build agent (macOS arm64)
        run: |
          cd agent
          cargo build --release --locked --offline
          mkdir -p dist
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          cp target/release/stats "dist/stats-$version-aarch64-apple-darwin"
          (cd dist && shasum -a 256 "stats-$version-aarch64-apple-darwin" > SHA256SUMS.macos)
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-macos
          path: |
            agent/dist/stats-*-aarch64-apple-darwin
            agent/dist/SHA256SUMS.macos

  build-statsctl:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.18.0
      - name: Install dependencies
        run: cd cloudflare && pnpm install --frozen-lockfile
      - name: Build statsctl
        run: ./scripts/build-statsctl.sh
      - name: Upload statsctl
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: statsctl
          path: |
            dist/statsctl-*.mjs
            dist/SHA256SUMS.statsctl

  publish:
    needs: [build-agent-linux, build-agent-macos, build-statsctl]
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts/agent-linux -type f -name 'stats-*' -exec cp {} release/ \;
          find artifacts/agent-macos -type f -name 'stats-*' -exec cp {} release/ \;
          find artifacts/statsctl -type f -name 'statsctl-*' -exec cp {} release/ \;
          cp install.sh release/
          (cd release && sha256sum stats-* statsctl-*.mjs install.sh > SHA256SUMS)
          ls -la release/
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
            if [ -z "$tag" ]; then
              version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' agent/Cargo.toml | head -n 1)
              tag="v$version"
            fi
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          printf 'releasing %s\n' "$tag"
      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: release/*
          generate_release_notes: true

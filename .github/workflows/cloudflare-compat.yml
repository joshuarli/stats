name: cloudflare compatibility candidate

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'

permissions: {}

concurrency:
  group: cloudflare-compatibility-candidate
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  candidate:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 12.18.0
          runtime: node@26.13.1
          install: false
      - run: pnpm install --frozen-lockfile
      - name: validate isolated candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TMPDIR: ${{ github.workspace }}/.work/tmp
        run: |
          make work-ready node-ready
          node cloudflare/scripts/compatibility-candidate.ts
      - name: retain proposal and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloudflare-candidate
          path: |
            .work/tmp/cloudflare-report-*/
            .work/tmp/cloudflare-candidate-*/*.log
          retention-days: 14

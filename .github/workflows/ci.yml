name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

env:
  TMPDIR: ${{ github.workspace }}/.work/tmp
  PNPM_CONFIG_STORE_DIR: ${{ github.workspace }}/.work/tmp/pnpm-store

jobs:
  test:
    name: test
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: laputa-systems/buildlib/setup@1cd9d482a684e72c68ac6fea7f4ee3a3e9c4a161 # v0.3.1
        with:
          tools: jaq rg
          lock: .github/tools.lock.json

      - name: Check out legacy baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: e58e9885c90082a006713b14a9d8fe348ecd2dbe
          path: .work/wt/baseline
          persist-credentials: false

      - name: Install legacy build tools
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          version: 12.15.0
          runtime: node@26.12.1
          working-directory: .work/wt/baseline
          dest: ${{ github.workspace }}/.work/tmp/legacy-pnpm
          install: false

      - name: Build legacy Workers
        working-directory: .work/wt/baseline
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir cloudflare build
          pnpm --dir cloudflare run build:observe

      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          version: 12.21.0
          runtime: node@26.13.1
          install: false

      - name: Install dependencies
        run: |
          mkdir -p .work/tmp
          pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        run: pnpm --filter @stats/telemetry exec playwright install --with-deps chromium

      - name: Install the OpenOrange runtime
        run: cd deploy/orange && pnpm install --frozen-lockfile

      - name: Tests
        env:
          BASELINE_WORKTREE: ${{ github.workspace }}/.work/wt/baseline
        run: make test-ci

  dashboard:
    name: dashboard
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          version: 12.21.0
          runtime: node@26.13.1
          install: false

      - name: Install dependencies
        run: |
          mkdir -p .work/tmp
          pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        run: pnpm --filter @stats/telemetry exec playwright install chromium

      - name: Dashboard tests
        run: |
          pnpm --filter @stats/telemetry build:all
          pnpm --filter @stats/telemetry test:ui

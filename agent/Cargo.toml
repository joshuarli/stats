[package]
name = "niceforge-telemetry"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
name = "niceforge_telemetry"
path = "src/lib.rs"

[[bin]]
name = "niceforge-telemetry"
path = "src/main.rs"

[dependencies]
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
opt-level = "s"

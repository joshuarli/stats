[package]
name = "stats"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
name = "stats"
path = "src/lib.rs"

[[bin]]
name = "stats"
path = "src/main.rs"

[dependencies]
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.0", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
opt-level = "s"

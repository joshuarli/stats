[package]
name = "stats"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[lib]
name = "stats"
path = "src/lib.rs"

[[bin]]
name = "stats"
path = "src/main.rs"

[dependencies]
libc = "0.2.191"
deser = { version = "0.10.2", features = ["derive"] }
deser-json = "0.10.2"
deser-value = "0.10.2"
h12tiny-client-sync = { version = "0.7.0", registry = "mycrates", features = ["tls"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
opt-level = "s"

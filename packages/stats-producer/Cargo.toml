[package]
name = "stats-producer"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Bounded, non-blocking application telemetry producer for Stats"
license = "UNLICENSED"

[dependencies]
deser = { version = "0.10.2", features = ["derive"] }
deser-json = "0.10.2"
h12tiny-client-sync = { version = "0.9.0", registry = "mycrates", features = ["tls"] }
